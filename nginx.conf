# ============================================================
# Nginx — ASM Platform SaaS (*.innosft.com)
# Innosoft Creation — Configuration de déploiement
# ============================================================
#
# Structure :
#   {slug}.innosft.com/        → Frontend React (build statique)
#   {slug}.innosft.com/api/    → Backend Express (port 5000)
#   {slug}.innosft.com/uploads → Fichiers uploadés (photos, logos, PDFs)
#
# Chaque sous-domaine = 1 tenant distinct
# Même build frontend, même backend — résolution par req.hostname
#
# Prérequis :
#   - DNS wildcard : *.innosft.com → IP du serveur
#   - SSL wildcard : certbot certonly --dns ... -d "*.innosft.com" -d "innosft.com"
#   - Build frontend : cd frontend && npm run build → dist/
#   - Backend démarré : pm2 start dist/index.js --name asm-backend
# ============================================================

# Redirection HTTP → HTTPS (tous les sous-domaines)
server {
    listen 80;
    server_name *.innosft.com innosft.com;
    return 301 https://$host$request_uri;
}

# ============================================================
# TENANT WILDCARD — {slug}.innosft.com
# Couvre : asm-location, boucotteauto, zigauto, autocitydakar...
# ============================================================
server {
    listen 443 ssl;
    server_name ~^(?<tenant_slug>.+)\.innosft\.com$;

    # Certificat wildcard SSL (Let's Encrypt via Certbot DNS challenge)
    ssl_certificate     /etc/letsencrypt/live/innosft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innosft.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Taille max upload (photos, logos)
    client_max_body_size 10M;

    # ── API Backend ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";  # WebSocket (Socket.io)
        proxy_read_timeout 60s;
    }

    # ── Fichiers uploadés (photos véhicules, logos, PDFs) ──
    location /uploads/ {
        alias /var/www/asm-platform/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Frontend React (SPA) ────────────────────────────────
    location / {
        root  /var/www/asm-platform/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;  # React Router fallback

        # Cache assets avec hash (Vite génère des noms uniques)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

# ============================================================
# SUPER ADMIN — app.innosft.com (ou admin.innosft.com)
# Même build React — résout SUPER_ADMIN via premier tenant
# ============================================================
server {
    listen 443 ssl;
    server_name app.innosft.com;

    ssl_certificate     /etc/letsencrypt/live/innosft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innosft.com/privkey.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    location /uploads/ {
        alias /var/www/asm-platform/backend/uploads/;
        expires 7d;
    }

    location / {
        root  /var/www/asm-platform/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
