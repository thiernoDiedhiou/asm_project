# ============================================================
# Nginx — ASM Platform SaaS (*.location.innosft.com)
# Innosoft Creation — Configuration de déploiement
# ============================================================
#
# Structure :
#   {slug}.location.innosft.com/        → Frontend React (build statique)
#   {slug}.location.innosft.com/api/    → Backend Express (port 5000)
#   {slug}.location.innosft.com/uploads → Fichiers uploadés (photos, logos, PDFs)
#
# Chaque sous-domaine = 1 tenant distinct
# Même build frontend, même backend — résolution par req.hostname
#
# Prérequis :
#   - DNS wildcard : *.location.innosft.com → IP du serveur
#   - SSL wildcard : certbot certonly --dns ... -d "*.location.innosft.com"
#   - Build frontend : cd frontend && npm run build → dist/
#   - Backend démarré : pm2 start dist/index.js --name asm-backend
#   - Chemin déploiement : /home/tfksservice/Location/asm_project/
# ============================================================

# Redirection HTTP → HTTPS (domaine racine + sous-domaines)
server {
    listen 80;
    server_name location.innosft.com www.location.innosft.com;
    return 301 https://location.innosft.com$request_uri;
}

server {
    listen 80;
    server_name *.location.innosft.com;
    return 301 https://$host$request_uri;
}

# ============================================================
# LANDING PAGE — location.innosft.com (domaine racine)
# Page d'accueil générale de la plateforme ASM
# ============================================================
server {
    listen 443 ssl;
    server_name location.innosft.com www.location.innosft.com;

    ssl_certificate     /etc/letsencrypt/live/location.innosft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/location.innosft.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Redirection www → non-www
    if ($host = www.location.innosft.com) {
        return 301 https://location.innosft.com$request_uri;
    }

    root /home/tfksservice/Location/asm_project/landing;
    index index.html;

    # Sécurité basique
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── SEO : sitemapindex principal (landing + vitrines agences) ───────
    # Sert le fichier statique landing/sitemap.xml (sitemapindex)
    # qui référence sitemap-static.xml (landing page) ET /api/public/sitemap (agences)
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SEO : sitemapindex statique (landing + agences) ──────────────────
    location = /sitemap-static.xml {
        # Fichier statique dans landing/
        try_files $uri =404;
    }

    # ── API (endpoints publics sans tenant : /api/public/agences, etc.) ──
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Logos uploadés (utilisés par les cards agences) ──
    location /uploads/ {
        alias /home/tfksservice/Location/asm_project/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Assets statiques — cache long
    location ~* \.(css|js|woff2?|png|jpg|jpeg|svg|ico|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /index.html → / (URL propre)
    location = /index.html {
        return 301 /;
    }

    # /contact.html (et tout autre .html) → sans extension
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # URLs propres : /contact sert contact.html automatiquement
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}

# ============================================================
# TENANT WILDCARD — {slug}.location.innosft.com
# Couvre : asm.location, boucotte.location, zigauto.location...
# ============================================================
server {
    listen 443 ssl;
    server_name ~^(?<tenant_slug>.+)\.location\.innosft\.com$;

    # Certificat wildcard SSL (Let's Encrypt via Certbot DNS challenge)
    ssl_certificate     /etc/letsencrypt/live/location.innosft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/location.innosft.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Taille max upload (photos, logos)
    client_max_body_size 10M;

    # ── SEO : sitemap dynamique du tenant (pages publiques de la vitrine) ──
    location = /sitemap.xml {
        proxy_pass         http://127.0.0.1:5000/api/public/sitemap;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header         Content-Type "application/xml; charset=utf-8";
    }

    # ── SEO : robots.txt dynamique (référence le sitemap du tenant) ──────
    location = /robots.txt {
        proxy_pass         http://127.0.0.1:5000/api/public/robots;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        add_header         Content-Type "text/plain; charset=utf-8";
    }

    # ── API Backend ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";  # WebSocket (Socket.io)
        proxy_read_timeout 60s;
    }

    # ── Fichiers uploadés (photos véhicules, logos, PDFs) ──
    location /uploads/ {
        alias /home/tfksservice/Location/asm_project/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Frontend React (SPA) ────────────────────────────────
    location / {
        root  /home/tfksservice/Location/asm_project/frontend/dist;
        try_files $uri $uri/ @spa;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /home/tfksservice/Location/asm_project/frontend/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location @spa {
        root  /home/tfksservice/Location/asm_project/frontend/dist;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}

# ============================================================
# SUPER ADMIN — admin.location.innosft.com
# Même build React — résout SUPER_ADMIN via premier tenant
# ============================================================
server {
    listen 443 ssl;
    server_name admin.location.innosft.com;

    ssl_certificate     /etc/letsencrypt/live/location.innosft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/location.innosft.com/privkey.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Bloquer l'indexation Google — l'admin ne doit JAMAIS apparaître dans les résultats
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location /uploads/ {
        alias /home/tfksservice/Location/asm_project/backend/uploads/;
        expires 7d;
    }

    location / {
        root  /home/tfksservice/Location/asm_project/frontend/dist;
        try_files $uri $uri/ @spa_admin;
    }

    location @spa_admin {
        root  /home/tfksservice/Location/asm_project/frontend/dist;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
}
